name: Deploy to Contabo

on:
  push:
    branches:
      - contabo-main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Contabo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # S'arrêter au premier plantage
            set -e

            echo "🚀 Début du déploiement frontend..."
            
            # 1. Créer le dossier parent s'il n'existe pas encore sur le serveur
            mkdir -p /var/www/talent-hubapp
            
            # 2. Gestion intelligente du dépôt Git
            if [ ! -d "/var/www/talent-hubapp/frontend/.git" ]; then
              echo "📭 Le dossier n'est pas encore un dépôt Git. Clonage initial..."
              # On vide le dossier s'il contenait des fichiers résiduels pour éviter les conflits de clonage
              rm -rf /var/www/talent-hubapp/frontend
              git clone -b contabo-main https://github.com/Tprojects1900/talenthub.git /var/www/talent-hubapp/frontend
              cd /var/www/talent-hubapp/frontend
            else
              echo "📥 Dépôt existant détecté. Récupération des dernières modifications..."
              cd /var/www/talent-hubapp/frontend
              git fetch origin contabo-main
              git reset --hard origin/contabo-main
            fi

            # 3. Installation propre des dépendances
            echo "📦 Installation des dépendances..."
            npm ci --legacy-peer-deps --loglevel error

            # 4. Phase de Build (optimisée pour la mémoire de ton VPS Contabo)
            echo "⚙️ Lancement du Build de l'application..."
            NODE_OPTIONS="--max-old-space-size=2048" npm run build

            # 5. Libération d'espace disque après compilation
            echo "🧹 Nettoyage des caches..."
            npm cache clean --force

            echo "✅ Déploiement et Build terminés avec succès !"