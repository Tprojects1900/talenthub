name: Deploy Contabo

on:
  push:
    branches:
      - contabo-main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Contabo
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            echo "🚀 Déploiement frontend"

            cd /var/www/talent-hubapp/frontend

            git pull origin contabo-main

            npm install

            npm run build


            echo "🚀 Déploiement backend"

            cd /var/www/talent-hubapp/backend

            git pull origin contabo-main

            npm install


            echo "🔄 Redémarrage backend"

            pm2 restart talenthub-backend